# Nginx config for autoforwardmessage.online
# Place at: /etc/nginx/sites-available/autoforward
# Then: ln -s /etc/nginx/sites-available/autoforward /etc/nginx/sites-enabled/
# Then: nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name autoforwardmessage.online www.autoforwardmessage.online;

    # Redirect all HTTP → HTTPS (certbot will fill this in)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name autoforwardmessage.online www.autoforwardmessage.online;

    # SSL certificates (filled in by certbot)
    ssl_certificate     /etc/letsencrypt/live/autoforwardmessage.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autoforwardmessage.online/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Proxy to Node.js app
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Static assets cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    access_log /var/log/nginx/autoforward_access.log;
    error_log  /var/log/nginx/autoforward_error.log;
}
